spring.application.name=product-service
server.port=8081

spring.datasource.url=jdbc:mysql://db:3306/shoeshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=shoeshop
spring.datasource.password=shoeshop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans,configprops,mappings
management.endpoint.health.show-details=always

info.app.name=${spring.application.name}
info.app.description=${spring.application.description} # Cần định nghĩa spring.application.description
info.app.version=@project.version@
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl