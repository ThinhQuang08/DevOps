server {
    listen 80;
    server_name localhost; # Hoặc tên miền của ní nếu có

    # Phục vụ các file tĩnh từ /usr/share/nginx/html/static
    location /static/ {
        alias /usr/share/nginx/html/static/;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Tất cả các request khác (không phải /static/) sẽ được proxy đến backend
    location / {
        proxy_pass http://backend:8080; # 'backend' là tên service của BE container trong Docker Compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port "8000";
    }
}